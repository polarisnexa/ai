<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 自動化團隊經營系統 - 夥伴預約註冊</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { background-color: #f4f7f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .btn-primary { background: linear-gradient(135deg, #0d6efd, #0a58ca); border: none; padding: 12px; font-weight: bold; border-radius: 10px; }
    .btn-success { background: linear-gradient(135deg, #06c755, #00b900); border: none; padding: 14px; font-weight: bold; border-radius: 10px; font-size: 1.1rem; }
    .profile-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid #0d6efd; }
    .status-box { background-color: #f8f9fa; border: 1px dashed #6c757d; border-radius: 10px; padding: 15px; }
  </style>
</head>
<body class="py-4">
  <div class="container" style="max-width: 480px;">
    
    <!-- 表單卡片 -->
    <div class="card p-4" id="formCard">
      <div class="text-center mb-3">
        <img id="userImg" src="https://via.placeholder.com/70" class="profile-img mb-2" alt="頭貼">
        <h4 class="fw-bold mb-1">PolarisNexa 預約註冊</h4>
        <p class="text-muted small">AI 負責流程，您負責維護人際關係</p>
      </div>

      <!-- SEO 引流與無 Ref 提示容器 -->
      <div id="alertMessage" class="d-none"></div>

      <form id="regForm">
        <input type="hidden" id="lineUserId" name="lineUserId">
        
        <div class="mb-3">
          <label class="form-label fw-bold">真實姓名 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="name" required placeholder="請輸入姓名">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">聯絡電話 <span class="text-danger">*</span></label>
          <input type="tel" class="form-control" id="phone" required placeholder="0912345678">
        </div>

        <!-- 📌 新增 LINE ID 欄位 -->
        <div class="mb-3">
          <label class="form-label fw-bold">LINE ID <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="lineId" required placeholder="請輸入您的 LINE ID (若無請填手機)">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">推薦人系統編號</label>
          <input type="text" class="form-control" id="refId" placeholder="帶入推薦人專屬連結中..." readonly>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-2">提交預約註冊</button>
      </form>
    </div>

    <!-- 成功導引卡片 (待開通提示) -->
    <div class="card p-4 text-center d-none" id="successCard">
      <div class="my-2">
        <div style="font-size: 50px;">🎉</div>
        <h4 class="fw-bold text-success mb-2">預約資料已成功送出！</h4>
        
        <div class="status-box mb-3 text-start">
          <div class="fw-bold text-dark mb-1">📋 審核狀態：<span class="text-warning">待開通驗證</span></div>
          <p class="small text-muted mb-0">
            您的資料已順利建立。請點擊下方按鈕加入 LINE 官方帳號完成對接，審核通過後，<strong>您的介紹人將會親自把專屬推廣連結傳送給您！</strong>
          </p>
        </div>

        <button id="lineBotBtn" class="btn btn-success w-100 shadow mb-2">
          💬 開開啟 / 加入 LINE AI 機器人
        </button>
      </div>
    </div>

  </div>

  <script>
    // ⚙️ 設定區
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyHUFyh_85Bz8pSfJsJMP2dlvNTu6K97McSGKfOknbKUHyx52XxA36s6F2A4_57j6M/exec";
    const LINE_BOT_ADD_LINK = "https://lin.ee/ZsTNJz4x";

    let currentRefCode = "";

    async function main() {
      try {
        // 1. 初始化 LIFF
        if (typeof liff !== "undefined") {
          await liff.init({ liffId: "2011043455-z9yvj9dV" });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            document.getElementById("lineUserId").value = profile.userId || "";
            document.getElementById("userImg").src = profile.pictureUrl || "https://via.placeholder.com/70";
          }
        }

        // 2. 檢查 URL 網址中的 ?ref= 參數
        currentRefCode = getRefParam();

        // 3. 執行 SEO 檢驗與表單鎖定機制
        checkAndApplyRefLock(currentRefCode);

      } catch (err) {
        console.error("LIFF 初始化或解析失敗:", err);
      }
    }

    // 解析 ref 參數
    function getRefParam() {
      let ref = new URLSearchParams(window.location.search).get("ref");
      if (!ref && window.location.href.includes("liff.state")) {
        const rawState = window.location.href.split("liff.state=")[1];
        if (rawState) {
          const decodedState = decodeURIComponent(rawState);
          const match = decodedState.match(/[?&]ref=([^&]+)/);
          if (match) ref = match[1];
        }
      }
      return ref ? ref.trim() : "";
    }

    // 表單鎖定與 SEO 引流阻擋邏輯
    function checkAndApplyRefLock(refCode) {
      const alertBox = document.getElementById("alertMessage");
      const refInput = document.getElementById("refId");
      const submitBtn = document.getElementById("submitBtn");
      const inputs = document.querySelectorAll("#regForm input:not([type='hidden'])");

      if (!refCode || refCode === "") {
        const msg = "⚠️ 提示：請聯絡您的介紹人索取註冊連結，或者透過網路搜尋「AI 自動化團隊經營系統」找到專屬團隊連結。";
        
        alertBox.innerHTML = `<div class="alert alert-danger fw-bold small mb-3">${msg}</div>`;
        alertBox.classList.remove("d-none");

        inputs.forEach(input => input.disabled = true);
        refInput.value = "無推薦人代碼 (已被鎖定)";
        
        submitBtn.disabled = true;
        submitBtn.innerText = "請透過介紹人專屬連結預約";
        submitBtn.className = "btn btn-secondary w-100 mt-2";
      } else {
        refInput.value = refCode;
        refInput.style.backgroundColor = "#e9ecef";
      }
    }

    main();

    // 提交表單（採用 API 異步傳送）
    document.getElementById("regForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      if (!currentRefCode) {
        alert("無有效的推薦人代碼，無法提交表單！");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "正在傳送資料...";

      // 📌 封裝 payload 資料，加入 lineId
      const payload = {
        userId: document.getElementById("lineUserId").value,
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        lineId: document.getElementById("lineId").value, // 📌 新增 LINE ID 欄位
        ref: currentRefCode,
        refId: currentRefCode
      };

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const res = await response.json();
        if (res.status === "error") {
          alert("預約失敗：" + (res.message || "發生未知錯誤"));
          btn.disabled = false;
          btn.innerText = "重新提交預約註冊";
          return;
        }

        showSuccessCard();
      } catch (err) {
        console.warn("後端 API 傳送回應預期外，仍執行前端成功畫面:", err);
        showSuccessCard();
      }
    });

    function showSuccessCard() {
      document.getElementById("formCard").classList.add("d-none");
      document.getElementById("successCard").classList.remove("d-none");
    }

    // 開啟 LINE 機器人按鈕
    document.getElementById("lineBotBtn").addEventListener("click", function(e) {
      e.preventDefault();
      if (typeof liff !== "undefined" && liff.isInClient()) {
        liff.openWindow({
          url: LINE_BOT_ADD_LINK,
          external: true
        });
      } else {
        window.location.href = LINE_BOT_ADD_LINK;
      }
    });
  </script>
</body>
</html>
