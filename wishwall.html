<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolarisNexa 智慧許願牆｜會員資格即時審查與啟動</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            wishNavy: '#0B0F19',
            wishCard: '#131B2E',
            wishCyan: '#38BDF8',
            wishGold: '#F59E0B',
            wishPurple: '#8B5CF6'
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'star-twinkle': 'twinkle 3s ease-in-out infinite alternate'
          },
          keyframes: {
            twinkle: {
              '0%': { opacity: '0.3', transform: 'scale(0.8)' },
              '100%': { opacity: '1', transform: 'scale(1.2)' }
            }
          }
        }
      }
    }
  </script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background-color: #0B0F19;
      color: #F3F4F6;
      overflow-x: hidden;
    }
    .bg-stars {
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 50px 80px, #38BDF8, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 100px 40px, #F59E0B, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 170px 130px, #8B5CF6, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 220px 220px;
    }
    .glass-card {
      background: rgba(19, 27, 46, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-gold-card {
      background: rgba(245, 158, 11, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
  </style>
</head>
<body class="bg-wishNavy bg-stars antialiased selection:bg-wishGold selection:text-black">

  <!-- Navigation Bar -->
  <nav class="fixed top-0 left-0 right-0 z-50 glass-card border-b border-gray-800/80 px-4 py-3.5">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="p-1.5 bg-gradient-to-tr from-wishGold to-wishCyan rounded-lg text-black font-black text-xl flex items-center justify-center shadow-lg shadow-wishGold/20">
          <i data-lucide="sparkles" class="w-5 h-5 text-gray-900"></i>
        </div>
        <span class="text-xl font-black tracking-wider text-white">Polaris<span class="text-wishGold">Nexa</span> <span class="text-xs font-normal text-wishCyan px-2 py-0.5 rounded-full bg-wishCyan/10 border border-wishCyan/20">許願牆權益中心</span></span>
      </div>
      <div class="text-xs text-gray-400 flex items-center space-x-1">
        <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
        <span>資料庫即時連線中</span>
      </div>
    </div>
  </nav>

  <!-- HERO 首屏 -->
  <section class="relative pt-32 pb-12 md:pt-40 md:pb-16 px-4 overflow-hidden">
    <div class="max-w-4xl mx-auto text-center relative z-10 space-y-6">
      
      <!-- 動態 推薦人 AT 代碼列 -->
      <div class="inline-flex items-center space-x-2 px-4 py-2 rounded-full glass-gold-card text-wishGold text-sm font-medium animate-pulse-slow">
        <i data-lucide="user-check" class="w-4 h-4 text-wishGold"></i>
        <span>您的專屬引路人 (推薦人代碼)：<strong id="display-ref-code" class="text-white underline decoration-wishGold tracking-wider font-mono">載入中...</strong></span>
      </div>

      <!-- 主標題 -->
      <h1 class="text-3xl md:text-5xl font-black text-white leading-tight">
        用 AI 賦能消費生活<br>
        <span class="bg-gradient-to-r from-wishGold via-amber-200 to-wishCyan bg-clip-text text-transparent">
          啟動許願牆讓大家一起幫你實現願望
        </span>
      </h1>

      <p class="text-base text-gray-300 max-w-xl mx-auto">
        請輸入您的 <span class="text-wishGold font-mono font-bold">ATxxxxxx</span> 編號或系統帳號，即時審查您的 <span class="text-wishCyan font-bold">10,000 PV</span> 許願牆啟動資格。
      </p>

    </div>
  </section>

  <!-- 核心區域：會員查詢與資格啟動面板 -->
  <section id="verify-section" class="py-8 px-4 relative">
    <div class="max-w-2xl mx-auto">
      
      <div class="glass-card p-8 md:p-10 rounded-3xl border border-gray-700/80 relative shadow-2xl">
        
        <!-- 步驟 A: 輸入會員 AT 編號查詢 -->
        <div class="mb-8 p-6 rounded-2xl bg-gray-950/80 border border-gray-800 space-y-4">
          <label class="block text-sm font-bold text-gray-200 flex items-center justify-between">
            <span>🔍 第一步：驗證您的會員身分 (AT 代碼)</span>
            <span class="text-xs text-wishCyan">即時連動 1_會員名冊</span>
          </label>
          <div class="flex gap-3">
            <div class="relative flex-1">
              <input type="text" id="input-search-mid" placeholder="請輸入您的合作平台編號 (例: AT4051)"
                class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 pl-11 text-white font-mono uppercase focus:border-wishCyan focus:outline-none">
              <i data-lucide="search" class="w-5 h-5 text-gray-500 absolute left-3.5 top-3.5"></i>
            </div>
            <button type="button" id="btn-check-pv"
              class="px-6 py-3 rounded-xl bg-wishCyan text-gray-950 font-bold hover:brightness-110 transition flex items-center space-x-1">
              <span>查詢資格</span>
            </button>
          </div>
        </div>

        <!-- 步驟 B: 資格結果展示面板 -->
        <div id="status-panel" class="hidden mb-8 p-6 rounded-2xl transition-all duration-300">
          <div class="flex items-center justify-between mb-4 pb-4 border-b border-gray-800">
            <div>
              <span class="text-xs text-gray-400 block">會員姓名</span>
              <strong id="res-name" class="text-lg text-white">--</strong>
            </div>
            <div class="text-right">
              <span class="text-xs text-gray-400 block">個人累積 PV (N欄)</span>
              <strong id="res-pv" class="text-xl font-mono text-wishCyan">0 PV</strong>
            </div>
          </div>

          <!-- 審查狀態 Badge -->
          <div id="status-badge" class="p-4 rounded-xl text-center font-bold text-sm">
            <!-- 動態插入：資格符合 / 未達標 -->
          </div>
        </div>

        <!-- 步驟 C: 確定啟動表單 (驗證通過後解鎖) -->
        <form id="wishwall-form" class="space-y-5">
          
          <input type="hidden" id="input-ref-code" name="refCode">
          <input type="hidden" id="input-member-id" name="memberId">

          <div>
            <label class="block text-xs font-bold text-gray-300 uppercase mb-1">
              LINE ID 或 LINE 顯示名稱 <span class="text-rose-400">*</span>
            </label>
            <input type="text" id="input-line" required placeholder="用於許願對接通知"
              class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white focus:border-wishGold focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-300 uppercase mb-1">
              銀行收款資訊 (接收 C2C 許願贊助) <span class="text-rose-400">*</span>
            </label>
            <input type="text" id="input-bank" required placeholder="銀行代碼 - 分行 - 戶名 - 帳號"
              class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white focus:border-wishGold focus:outline-none">
          </div>

          <!-- 啟動按鈕 (預設禁用，需查驗合格) -->
          <button type="submit" id="submit-btn" disabled
            class="w-full py-4 rounded-xl bg-gray-800 text-gray-500 font-black text-lg cursor-not-allowed transition-all duration-300 flex items-center justify-center space-x-2">
            <i data-lucide="lock" class="w-5 h-5"></i>
            <span>請先完成 AT 代碼資格查詢驗證</span>
          </button>

        </form>

        <div id="form-message" class="hidden mt-6 p-4 rounded-xl text-center text-sm font-medium"></div>

      </div>
    </div>
  </section>

  <!-- 頁尾 -->
  <footer class="py-10 border-t border-gray-800/80 bg-gray-950 text-center text-gray-500 text-xs space-y-2">
    <p>PolarisNexa Team System © 2026</p>
    <p class="text-gray-600">本系統與活動為 PolarisNexa 團隊內部研發之輔助工具，與任何特定商業公司官方無關。</p>
  </footer>

  <!-- 前端 JavaScript -->
  <script>
    const GAS_WEB_APP_URL = "YOUR_GAS_WEB_APP_URL_HERE";

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      // 1. 自動讀取網址的推薦人 AT 代碼 ?ref=ATxxxxx
      const urlParams = new URLSearchParams(window.location.search);
      const refCode = urlParams.get('ref') || 'AT193495'; // 預設代理 AT 編號
      const defaultMid = urlParams.get('mid') || '';

      document.getElementById('display-ref-code').textContent = refCode;
      document.getElementById('input-ref-code').value = refCode;

      if (defaultMid) {
        document.getElementById('input-search-mid').value = defaultMid;
      }

      // 2. 即時查詢會員 PV 與審查資格 (比對系統編號與 AT 欄位)
      const checkBtn = document.getElementById('btn-check-pv');
      const statusPanel = document.getElementById('status-panel');
      const statusBadge = document.getElementById('status-badge');
      const submitBtn = document.getElementById('submit-btn');

      checkBtn.addEventListener('click', async () => {
        const mid = document.getElementById('input-search-mid').value.trim();
        if (!mid) {
          alert("請輸入您的 AT 編號或系統會員編號！");
          return;
        }

        checkBtn.disabled = true;
        checkBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>查詢中...</span>`;
        lucide.createIcons();

        try {
          let memberInfo = null;

          if (GAS_WEB_APP_URL === "YOUR_GAS_WEB_APP_URL_HERE") {
            // 💡 模擬測試數據
            memberInfo = {
              name: "測試會員",
              personalPV: 12000,
              pvStatus: "已驗證"
            };
          } else {
            const res = await fetch(`${GAS_WEB_APP_URL}?action=getMemberStatus&mid=${encodeURIComponent(mid)}`);
            memberInfo = await res.json();
          }

          // 顯示資訊面板
          statusPanel.classList.remove('hidden');
          document.getElementById('res-name').textContent = memberInfo.name || "未登錄";
          document.getElementById('res-pv').textContent = `${(memberInfo.personalPV || 0).toLocaleString()} PV`;
          document.getElementById('input-member-id').value = mid;

          // 判定資格：個人 PV >= 10,000 或狀態為「已驗證」
          const isEligible = (memberInfo.personalPV >= 10000 || memberInfo.pvStatus === "已驗證");

          if (isEligible) {
            statusPanel.className = "mb-8 p-6 rounded-2xl bg-emerald-950/40 border border-emerald-500/30";
            statusBadge.className = "p-4 rounded-xl text-center font-bold text-sm bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
            statusBadge.innerHTML = `✨ 審查通過！您的累積消費達到 10,000 PV 門檻，可立即啟動許願牆！`;

            submitBtn.disabled = false;
            submitBtn.className = "w-full py-4 rounded-xl bg-gradient-to-r from-wishGold via-amber-500 to-amber-600 text-gray-950 font-black text-lg hover:brightness-110 shadow-xl cursor-pointer transition flex items-center justify-center space-x-2";
            submitBtn.innerHTML = `<i data-lucide="sparkle" class="w-5 h-5 fill-current"></i><span>🚀 資格確認：立刻啟動許願牆</span>`;
          } else {
            statusPanel.className = "mb-8 p-6 rounded-2xl bg-rose-950/40 border border-rose-500/30";
            statusBadge.className = "p-4 rounded-xl text-center font-bold text-sm bg-rose-500/20 text-rose-300 border border-rose-500/40";
            statusBadge.innerHTML = `⚠️ 尚不符合資格：個人消費累積需達 10,000 PV (目前還差 ${(10000 - memberInfo.personalPV).toLocaleString()} PV)`;

            submitBtn.disabled = true;
            submitBtn.className = "w-full py-4 rounded-xl bg-gray-800 text-gray-500 font-black text-lg cursor-not-allowed flex items-center justify-center space-x-2";
            submitBtn.innerHTML = `<i data-lucide="lock" class="w-5 h-5"></i><span>未達 10,000 PV 門檻，暫無法啟動</span>`;
          }

        } catch (err) {
          alert("查詢失敗，請確認 API 連線或輸入之 AT 編號。");
          console.error(err);
        } finally {
          checkBtn.disabled = false;
          checkBtn.innerHTML = `<span>查詢資格</span>`;
          lucide.createIcons();
        }
      });

    });
  </script>
</body>
</html>
