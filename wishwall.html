<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolarisNexa 智慧許願牆｜會員資格即時審查與啟動</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            wishNavy: '#0B0F19',
            wishCard: '#131B2E',
            wishCyan: '#38BDF8',
            wishGold: '#F59E0B',
            wishPurple: '#8B5CF6'
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #0B0F19;
      color: #F3F4F6;
    }
    .glass-card {
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-wishNavy antialiased selection:bg-wishGold selection:text-black">

  <!--導覽列-->
  <nav class="fixed top-0 left-0 right-0 z-50 glass-card border-b border-gray-800 px-4 py-3.5">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="p-1.5 bg-gradient-to-tr from-wishGold to-wishCyan rounded-lg text-black font-black flex items-center justify-center">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <span class="text-xl font-black text-white">Polaris<span class="text-wishGold">Nexa</span> <span class="text-xs font-normal text-wishCyan px-2 py-0.5 rounded-full bg-wishCyan/10 border border-wishCyan/20">許願牆權益中心</span></span>
      </div>
      <div id="nav-status" class="text-xs text-emerald-400 flex items-center space-x-1">
        <i data-lucide="shield-check" class="w-4 h-4"></i>
        <span>連線中</span>
      </div>
    </div>
  </nav>

  <!-- 主內容區 -->
  <main class="pt-28 pb-16 px-4 max-w-4xl mx-auto space-y-8">
    
    <!-- 頂部身分資訊卡 -->
    <div class="glass-card p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <span class="text-xs text-gray-400">目前操作會員</span>
        <h2 id="ui-member-name" class="text-2xl font-black text-white">載入中...</h2>
        <p class="text-xs font-mono text-wishCyan mt-1">系統編號：<span id="ui-member-id">--</span></p>
      </div>
      <div class="text-right">
        <span class="text-xs text-gray-400">個人累積消費 PV</span>
        <div id="ui-member-pv" class="text-2xl font-black font-mono text-wishGold">0 PV</div>
      </div>
    </div>

    <!-- 動態狀態面板 (未啟動 vs 已啟動) -->
    <div id="dynamic-content-area" class="space-y-6">
      <!-- 內容將由 JavaScript 動態渲染 -->
      <div class="text-center py-12 text-gray-400">
        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2 text-wishCyan"></i>
        <p>正在向資料庫驗證會員資格與許願牆狀態...</p>
      </div>
    </div>

  </main>

  <footer class="py-8 border-t border-gray-800 text-center text-gray-500 text-xs">
    <p>PolarisNexa Team System © 2026</p>
  </footer>

  <!-- 前端互動與 API 聯絡邏輯 -->
  <script>
    // 💡 請在此處填入您的 Google Apps Script 部署網址 (Web App URL)
    const GAS_WEB_APP_URL = "YOUR_GAS_WEB_APP_URL_HERE";

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();

      const urlParams = new URLSearchParams(window.location.search);
      const mid = urlParams.get('mid') || urlParams.get('ref') || '';

      if (!mid) {
        document.getElementById('dynamic-content-area').innerHTML = `
          <div class="glass-card p-8 rounded-2xl text-center text-rose-400 font-bold">
            ⚠️ 網址缺少必要的會員編號參數 (mid)，請透過 LINE 機器人「✨ 啟動許願牆」按鈕進入！
          </div>`;
        return;
      }

      document.getElementById('ui-member-id').textContent = mid;

      try {
        // 向 GAS 發送查詢請求
        let res, data;
        if (GAS_WEB_APP_URL === "YOUR_GAS_WEB_APP_URL_HERE") {
          // 測試模擬數據
          data = { found: true, memberId: mid, name: "測試夥伴", personalPV: 15000, pvStatus: "已驗證", isActivated: false };
        } else {
          res = await fetch(`${GAS_WEB_APP_URL}?action=getMemberStatus&mid=${encodeURIComponent(mid)}`);
          data = await res.json();
        }

        if (!data.found) {
          document.getElementById('dynamic-content-area').innerHTML = `
            <div class="glass-card p-8 rounded-2xl text-center text-rose-400 font-bold">
              ⚠️ 查無此會員編號 (${mid})，請確認是否已完成手機綁定與建檔。
            </div>`;
          return;
        }

        // 渲染基本資料
        document.getElementById('ui-member-name').textContent = data.name;
        document.getElementById('ui-member-pv').textContent = `${(data.personalPV || 0).toLocaleString()} PV`;

        // 判定資格 (PV >= 10000 或已驗證)
        const isEligible = (data.personalPV >= 10000 || data.pvStatus === "已驗證");

        if (!isEligible) {
          // 狀態 1：未達 10,000 PV 門檻
          renderNotEligibleView(data.personalPV);
        } else if (!data.isActivated) {
          // 狀態 2：符合資格，但尚未啟動許願牆 (需填寫銀行 I 欄)
          renderActivationFormView(mid, data.name);
        } else {
          // 狀態 3：已啟動許願牆 (展示 2x2 矩陣樹狀圖)
          renderActivatedDashboardView(mid, data.bankInfo);
        }

      } catch (e) {
        console.error(e);
        document.getElementById('dynamic-content-area').innerHTML = `
          <div class="glass-card p-8 rounded-2xl text-center text-rose-400 font-bold">
            🚨 連線資料庫發生錯誤，請稍後再試。
          </div>`;
      }
    });

    // 視圖 A：未達標
    function renderNotEligibleView(pv) {
      const diff = 10000 - pv;
      document.getElementById('dynamic-content-area').innerHTML = `
        <div class="glass-card p-8 rounded-2xl border border-rose-500/30 bg-rose-950/20 text-center space-y-4">
          <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto">
            <i data-lucide="lock" class="w-6 h-6"></i>
          </div>
          <h3 class="text-xl font-bold text-white">個人消費尚差 ${diff.toLocaleString()} PV 門檻</h3>
          <p class="text-sm text-gray-300">許願牆啟動需個人累積消費達 10,000 PV。請先至摩天樓福利購完成消費或回報 PV！</p>
        </div>`;
      lucide.createIcons();
    }

    // 視圖 B：符合資格，提供填寫銀行資訊 (I 欄) 啟動表單
    function renderActivationFormView(mid, name) {
      document.getElementById('dynamic-content-area').innerHTML = `
        <div class="glass-card p-8 rounded-2xl space-y-6">
          <div class="bg-emerald-950/40 border border-emerald-500/30 p-4 rounded-xl text-emerald-300 text-sm font-bold flex items-center space-x-2">
            <i data-lucide="check-circle" class="w-5 h-5 flex-shrink-0"></i>
            <span>恭喜！您的 10,000 PV 資格已審查通過，請填寫以下資訊正式啟動許願牆！</span>
          </div>

          <form id="activate-form" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-300 uppercase mb-1">LINE 帳號 / 暱稱</label>
              <input type="text" id="form-line" required placeholder="例如：Jack (用於對接贊助)"
                class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white focus:border-wishGold focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-300 uppercase mb-1">銀行收款資訊 (將寫入資料庫 I 欄)</label>
              <input type="text" id="form-bank" required placeholder="格式：004 臺灣銀行 0123-456-789123 戶名"
                class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white focus:border-wishGold focus:outline-none">
              <p class="text-xs text-gray-400 mt-1">💡 此資訊將提供給您的上線與贊助夥伴進行 C2C 許願金對接。</p>
            </div>

            <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-wishGold to-amber-600 text-gray-950 font-black text-lg hover:brightness-110 shadow-xl transition flex items-center justify-center space-x-2">
              <i data-lucide="sparkles" class="w-5 h-5"></i>
              <span>🚀 確認無誤，立即啟動許願牆</span>
            </button>
          </form>
        </div>`;
      lucide.createIcons();

      document.getElementById('activate-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const lineId = document.getElementById('form-line').value.trim();
        const bankInfo = document.getElementById('form-bank').value.trim();

        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = "正在寫入資料庫...";

        try {
          if (GAS_WEB_APP_URL === "YOUR_GAS_WEB_APP_URL_HERE") {
            alert("模擬啟動成功！");
            location.reload();
            return;
          }

          const res = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "activateWishWall", memberId: mid, lineId: lineId, bankInfo: bankInfo })
          });
          const result = await res.json();
          if (result.status === "success") {
            alert("🎉 許願牆啟動成功！");
            location.reload();
          } else {
            alert("啟動失敗：" + result.message);
            btn.disabled = false;
            btn.textContent = "🚀 確認無誤，立即啟動許願牆";
          }
        } catch (err) {
          alert("送出失敗，請檢查網路連線。");
          btn.disabled = false;
        }
      });
    }

    // 視圖 C：已啟動 (展示 2x2 矩陣樹狀圖)
    function renderActivatedDashboardView(mid, bankInfo) {
      document.getElementById('dynamic-content-area').innerHTML = `
        <div class="space-y-6">
          <div class="glass-card p-6 rounded-2xl border border-wishGold/30 bg-wishGold/5 flex items-center justify-between">
            <div>
              <span class="text-xs text-wishGold font-bold uppercase tracking-wider">狀態：已啟動許願牆</span>
              <h3 class="text-xl font-bold text-white mt-0.5">您的 2x2 矩陣組織戰情室</h3>
            </div>
            <div class="text-right text-xs text-gray-300">
              <p>銀行收款資訊：<span class="font-mono text-wishCyan">${bankInfo || "未填寫"}</span></p>
            </div>
          </div>

          <!-- 2x2 矩陣樹狀圖互動展現區 -->
          <div class="glass-card p-6 rounded-2xl space-y-6">
            <h4 class="text-sm font-bold text-gray-200 flex items-center space-x-2">
              <i data-lucide="git-branch" class="w-4 h-4 text-wishCyan"></i>
              <span>組織 2x2 矩陣預覽 (向下展開至多 5 代)</span>
            </h4>

            <div id="matrix-tree-container" class="p-6 rounded-xl bg-gray-950/80 border border-gray-800 text-center space-y-8">
              <!-- 節點展示 -->
              <div class="inline-block p-4 rounded-xl bg-wishGold/20 border border-wishGold text-wishGold font-bold shadow-lg">
                👑 本人：${mid} (L1)
              </div>
              <div class="grid grid-cols-2 gap-4 max-w-md mx-auto">
                <div class="p-3 rounded-xl bg-gray-900 border border-gray-700 text-sm text-gray-300">
                  左區夥伴 (待展開)
                </div>
                <div class="p-3 rounded-xl bg-gray-900 border border-gray-700 text-sm text-gray-300">
                  右區夥伴 (待展開)
                </div>
              </div>
            </div>
          </div>
        </div>`;
      lucide.createIcons();
    }
  </script>
</body>
</html>
