<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolarisNexa 智慧許願牆｜會員資格即時審查與啟動</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            wishNavy: '#0B0F19',
            wishCard: '#131B2E',
            wishCyan: '#38BDF8',
            wishGold: '#F59E0B',
            wishPurple: '#8B5CF6'
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #0B0F19;
      color: #F3F4F6;
    }
    .glass-card {
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-wishNavy antialiased selection:bg-wishGold selection:text-black">

  <!--導覽列-->
  <nav class="fixed top-0 left-0 right-0 z-50 glass-card border-b border-gray-800 px-4 py-3.5">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="p-1.5 bg-gradient-to-tr from-wishGold to-wishCyan rounded-lg text-black font-black flex items-center justify-center">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <span class="text-xl font-black text-white">Polaris<span class="text-wishGold">Nexa</span> <span class="text-xs font-normal text-wishCyan px-2 py-0.5 rounded-full bg-wishCyan/10 border border-wishCyan/20">許願牆權益中心</span></span>
      </div>
      <div id="nav-status" class="text-xs text-emerald-400 flex items-center space-x-1">
        <i data-lucide="shield-check" class="w-4 h-4"></i>
        <span>安全加密連線</span>
      </div>
    </div>
  </nav>

  <!-- 主內容區 -->
  <main class="pt-28 pb-16 px-4 max-w-4xl mx-auto space-y-8">
    
    <!-- 頂部身分資訊卡 -->
    <div class="glass-card p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <span id="ui-role-label" class="text-xs text-gray-400">目前檢視對象</span>
        <h2 id="ui-member-name" class="text-2xl font-black text-white">載入中...</h2>
        <p class="text-xs font-mono text-wishCyan mt-1">系統編號：<span id="ui-member-id">--</span></p>
      </div>
      <div class="text-right">
        <span class="text-xs text-gray-400">資格狀態</span>
        <div id="ui-member-pv" class="text-lg font-black font-mono text-wishGold">驗證中...</div>
      </div>
    </div>

    <!-- 動態狀態面板 -->
    <div id="dynamic-content-area" class="space-y-6">
      <div class="text-center py-12 text-gray-400">
        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2 text-wishCyan"></i>
        <p>正在安全驗證身分與調閱授權資料...</p>
      </div>
    </div>

  </main>

  <footer class="py-8 border-t border-gray-800 text-center text-gray-500 text-xs">
    <p>PolarisNexa Team System © 2026</p>
  </footer>

  <!-- 前端互動與 API 邏輯 -->
  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyHUFyh_85Bz8pSfJsJMP2dlvNTu6K97McSGKfOknbKUHyx52XxA36s6F2A4_57j6M/exec";

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();

      const urlParams = new URLSearchParams(window.location.search);
      const mid = urlParams.get('mid') || '';
      const viewer = urlParams.get('viewer') || mid; // 若無 viewer 參數則視為本人或直接用 mid

      if (!mid) {
        document.getElementById('dynamic-content-area').innerHTML = `
          <div class="glass-card p-8 rounded-2xl text-center text-rose-400 font-bold">
            ⚠️ 網址缺少必要的會員編號參數 (mid)，請透過正確的授權連結進入！
          </div>`;
        return;
      }

      document.getElementById('ui-member-id').textContent = mid;

      try {
        const targetUrl = `${GAS_WEB_APP_URL}?action=getMemberStatus&mid=${encodeURIComponent(mid)}&viewer=${encodeURIComponent(viewer)}`;
        const res = await fetch(targetUrl);
        const data = await res.json();

        if (!data.found) {
          document.getElementById('dynamic-content-area').innerHTML = `
            <div class="glass-card p-8 rounded-2xl text-center text-rose-400 font-bold">
              ⚠️ 查無此會員編號 (${mid})，請確認代碼是否正確。
            </div>`;
          return;
        }

        // 判斷是否為訪客視圖 (非本人點擊)
        const isVisitor = urlParams.get('mode') === 'public' || (viewer && viewer !== mid);

        document.getElementById('ui-member-name').textContent = data.name;
        document.getElementById('ui-member-pv').textContent = data.pvStatus === "已驗證" ? "10,000 PV (已達標)" : "未達標";

        if (isVisitor) {
          // 🛡️ 訪客/贊助者視圖：保護隱私，僅顯示公開收款與贊助引導
          renderPublicVisitorView(data);
        } else {
          // 👑 會員本人戰情室：解鎖完整功能
          const isEligible = (data.pvStatus === "已驗證" || data.personalPV >= 10000);

          if (!isEligible) {
            renderNotEligibleView(data.personalPV);
          } else if (!data.isActivated) {
            renderActivationFormView(mid, data.name);
          } else {
            renderActivatedDashboardView(mid, data);
          }
        }

      } catch (e) {
        console.error(e);
        document.getElementById('dynamic-content-area').innerHTML = `
          <div class="glass-card p-8 rounded-2xl text-center text-rose-400 font-bold">
            🚨 連線資料庫發生錯誤，請稍後再試。
          </div>`;
      }
    });

    // 🛡️ 訪客檢視模式 (保護隱私)
    function renderPublicVisitorView(data) {
      document.getElementById('ui-role-label').textContent = "贊助對接專區 (訪客檢視)";
      document.getElementById('dynamic-content-area').innerHTML = `
        <div class="glass-card p-8 rounded-2xl space-y-6 text-center">
          <div class="w-16 h-16 rounded-full bg-wishGold/20 text-wishGold flex items-center justify-center mx-auto">
            <i data-lucide="heart-handshake" class="w-8 h-8"></i>
          </div>
          <h3 class="text-2xl font-bold text-white">歡迎支援 ${data.name} 的許願牆</h3>
          <p class="text-sm text-gray-300 max-w-md mx-auto">為了保護會員隱私，私人組織矩陣與戰情資料僅限會員本人登入檢視。</p>
          
          <div class="bg-gray-950 p-6 rounded-xl border border-gray-800 text-left space-y-3 max-w-lg mx-auto">
            <span class="text-xs text-wishCyan uppercase font-bold">目前可用的 C2C 贊助收款資訊：</span>
            <div class="p-4 bg-gray-900 rounded-lg font-mono text-wishGold text-sm">
              ${data.bankInfo || "尚未設定銀行收款資訊"}
            </div>
            <p class="text-xs text-gray-400">💡 進行贊助對接後，請透過 LINE 官方機器人回報憑證給予夥伴支援。</p>
          </div>
        </div>`;
      lucide.createIcons();
    }

    // 視圖 A：未達標
    function renderNotEligibleView(pv) {
      document.getElementById('dynamic-content-area').innerHTML = `
        <div class="glass-card p-8 rounded-2xl border border-rose-500/30 bg-rose-950/20 text-center space-y-4">
          <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto">
            <i data-lucide="lock" class="w-6 h-6"></i>
          </div>
          <h3 class="text-xl font-bold text-white">個人消費尚需完成 10,000 PV 驗證</h3>
          <p class="text-sm text-gray-300">許願牆啟動需個人累積消費達 10,000 PV。請先至摩天樓福利購完成消費或回報 PV！</p>
        </div>`;
      lucide.createIcons();
    }

    // 視圖 B：填寫銀行資訊啟動
    function renderActivationFormView(mid, name) {
      document.getElementById('dynamic-content-area').innerHTML = `
        <div class="glass-card p-8 rounded-2xl space-y-6">
          <div class="bg-emerald-950/40 border border-emerald-500/30 p-4 rounded-xl text-emerald-300 text-sm font-bold flex items-center space-x-2">
            <i data-lucide="check-circle" class="w-5 h-5 flex-shrink-0"></i>
            <span>恭喜！您的 10,000 PV 資格已審查通過，請填寫以下資訊正式啟動許願牆！</span>
          </div>

          <form id="activate-form" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-300 uppercase mb-1">LINE 帳號 / 暱稱</label>
              <input type="text" id="form-line" required placeholder="例如：Jack (用於對接贊助)"
                class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white focus:border-wishGold focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-300 uppercase mb-1">銀行收款資訊 (將寫入資料庫 I 欄)</label>
              <input type="text" id="form-bank" required placeholder="格式：004 臺灣銀行 0123-456-789123 戶名"
                class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white focus:border-wishGold focus:outline-none">
            </div>

            <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-wishGold to-amber-600 text-gray-950 font-black text-lg hover:brightness-110 shadow-xl transition flex items-center justify-center space-x-2">
              <i data-lucide="sparkles" class="w-5 h-5"></i>
              <span>🚀 確認無誤，立即啟動許願牆</span>
            </button>
          </form>
        </div>`;
      lucide.createIcons();

      document.getElementById('activate-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const lineId = document.getElementById('form-line').value.trim();
        const bankInfo = document.getElementById('form-bank').value.trim();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = "正在寫入資料庫...";

        try {
          const res = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "activateWishWall", memberId: mid, lineId: lineId, bankInfo: bankInfo })
          });
          const result = await res.json();
          if (result.status === "success") {
            alert("🎉 許願牆啟動成功！");
            location.reload();
          } else {
            alert("啟動失敗：" + result.message);
            btn.disabled = false;
            btn.textContent = "🚀 確認無誤，立即啟動許願牆";
          }
        } catch (err) {
          alert("送出失敗，請檢查網路連線。");
          btn.disabled = false;
        }
      });
    }

    // 👑 視圖 C：會員本人戰情室 (含 1-5 階升級與銀行管理)
    function renderActivatedDashboardView(mid, data) {
      document.getElementById('ui-role-label').textContent = "會員本人戰情室";
      document.getElementById('dynamic-content-area').innerHTML = `
        <div class="space-y-6">
          <div class="glass-card p-6 rounded-2xl border border-wishGold/30 bg-wishGold/5 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <span class="text-xs text-wishGold font-bold uppercase tracking-wider">狀態：已啟動許願牆</span>
              <h3 class="text-xl font-bold text-white mt-0.5">您的 1-5 階矩陣與升級戰情室</h3>
            </div>
            <div class="w-full md:w-auto">
              <button onclick="openBankEditModal('${data.bankInfo || ''}')" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded-xl text-xs font-bold text-wishCyan transition flex items-center justify-center space-x-1">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
                <span>修改銀行收款資訊 (I 欄)</span>
              </button>
            </div>
          </div>

          <!-- 1-5 階升級與組織對接專區 -->
          <div class="glass-card p-6 rounded-2xl space-y-4">
            <h4 class="text-sm font-bold text-gray-200 flex items-center space-x-2">
              <i data-lucide="trending-up" class="w-4 h-4 text-wishGold"></i>
              <span>向上升級專區 (對應 1-5 階矩陣)</span>
            </h4>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <button onclick="loadUpgradeDetails('${mid}', 2)" class="p-3 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded-xl text-left transition">
                <div class="text-xs text-gray-400">第二階升級</div>
                <div class="text-sm font-bold text-wishGold mt-1">NT$ 1,000 贊助</div>
              </button>
              <button onclick="loadUpgradeDetails('${mid}', 3)" class="p-3 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded-xl text-left transition">
                <div class="text-xs text-gray-400">第三階升級</div>
                <div class="text-sm font-bold text-wishGold mt-1">NT$ 3,000 贊助</div>
              </button>
              <button onclick="loadUpgradeDetails('${mid}', 4)" class="p-3 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded-xl text-left transition">
                <div class="text-xs text-gray-400">第四階升級</div>
                <div class="text-sm font-bold text-wishGold mt-1">NT$ 9,000 贊助</div>
              </button>
              <button onclick="loadUpgradeDetails('${mid}', 5)" class="p-3 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded-xl text-left transition">
                <div class="text-xs text-gray-400">第五階升級</div>
                <div class="text-sm font-bold text-wishGold mt-1">NT$ 27,000 贊助</div>
              </button>
            </div>
            <div id="upgrade-detail-box" class="p-4 rounded-xl bg-gray-950 border border-gray-800 text-sm text-gray-300 hidden">
              <!-- 動態載入上線收款對接資訊 -->
            </div>
          </div>

          <!-- 組織 2x2 矩陣樹狀圖 -->
          <div class="glass-card p-6 rounded-2xl space-y-4">
            <h4 class="text-sm font-bold text-gray-200 flex items-center space-x-2">
              <i data-lucide="git-branch" class="w-4 h-4 text-wishCyan"></i>
              <span>組織 2x2 矩陣樹狀預覽 (向下 1-5 代)</span>
            </h4>
            <div class="p-6 rounded-xl bg-gray-950 border border-gray-800 text-center space-y-6">
              <div class="inline-block p-4 rounded-xl bg-wishGold/20 border border-wishGold text-wishGold font-bold shadow-lg">
                👑 本人：${mid} (L1)
              </div>
              <div class="grid grid-cols-2 gap-4 max-w-md mx-auto">
                <div class="p-3 rounded-xl bg-gray-900 border border-gray-700 text-sm text-gray-300">左區組織夥伴</div>
                <div class="p-3 rounded-xl bg-gray-900 border border-gray-700 text-sm text-gray-300">右區組織夥伴</div>
              </div>
            </div>
          </div>
        </div>`;
      lucide.createIcons();
    }

    // 查詢特定階級的上線對接資訊
    async function loadUpgradeDetails(mid, level) {
      const box = document.getElementById('upgrade-detail-box');
      box.classList.remove('hidden');
      box.innerHTML = `<p class="text-wishCyan">正在向資料庫調閱第 ${level} 階對應上線資料...</p>`;

      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=getUpgradeInfo&mid=${encodeURIComponent(mid)}&targetLevel=${level}`);
        const result = await res.json();

        if (result.status === "success" && result.hasUpline) {
          const up = result.upline;
          box.innerHTML = `
            <div class="space-y-2">
              <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <span class="font-bold text-white">第 ${level} 階升級對象（您的對應上線）</span>
                <span class="text-wishGold font-mono">建議贊助：NT$ ${up.tierAmount.toLocaleString()}</span>
              </div>
              <p>👤 姓名：<span class="text-white font-bold">${up.name}</span> (${up.memberId})</p>
              <p>🏦 銀行收款：<span class="font-mono text-wishCyan">${up.bankInfo}</span></p>
              <p>📞 聯絡電話：<span class="font-mono text-gray-200">${up.phone || '未提供'}</span> | LINE ID: <span class="font-mono text-gray-200">${up.lineId || '未提供'}</span></p>
              <p class="text-xs text-gray-400 mt-2">💡 請完成轉帳後透過 LINE 聯絡上線並回報憑證以解鎖階級權益。</p>
            </div>`;
        } else {
          box.innerHTML = `<p class="text-rose-400">${result.message || '目前查無對應上線。'}</p>`;
        }
      } catch (err) {
        box.innerHTML = `<p class="text-rose-400">調閱上線資料失敗，請稍後再試。</p>`;
      }
    }

    // 修改銀行資訊彈窗 (直接寫回 I 欄)
    function openBankEditModal(currentBank) {
      const newBank = prompt("請輸入新的銀行收款資訊 (將更新至資料庫 I 欄)：", currentBank);
      if (newBank !== null) {
        alert("功能建構中：後續將透過 API 直接儲存您的銀行設定至試算表！");
      }
    }
  </script>
</body>
</html>
