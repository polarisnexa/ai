<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外送極速面板</title>
    <style>
        body {
            background-color: #121212; /* 深色護眼背景 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 6px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 280px;
        }

        /* 頂部資訊列 */
        .top-bar {
            background: #1E1E1E;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .app-title {
            font-size: 14px;
            font-weight: bold;
            color: #00BFA5;
        }

        .count-badge {
            font-size: 13px;
            color: #81C784;
            background: #252525;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid #444;
        }

        /* 動作按鈕：超大、清晰好點 */
        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px; /* 字體放大，清晰好辨識 */
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-align: center;
            margin-bottom: 6px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .btn-accept { background-color: #0288D1; } /* 藍：接新單 */
        .btn-start  { background-color: #2E7D32; } /* 綠：點擊取餐 */
        .btn-end    { background-color: #C62828; } /* 紅：點擊送達 */
        
        .action-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .status-box {
            background: #1E1E1E;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            color: #DDD;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- 頂部標題與今日累計 -->
        <div class="top-bar">
            <span class="app-title">🛵 外送快打</span>
            <span class="count-badge" id="today-count-hint">今日: 0件</span>
        </div>

        <!-- 動態面板區域 -->
        <div id="panel-body">
            <button class="action-btn btn-accept" onclick="addNewOrder()">➕ 接新單 (記錄時間)</button>
        </div>
    </div>

    <script>
        let currentOrderId = null;
        let orderData = {};

        window.onload = function() {
            checkAndResetDailyCount();
            updateCountHint();
        };

        function getTodayOrderNumber() {
            const todayStr = new Date().toDateString();
            let savedDate = localStorage.getItem('delivery_date');
            let currentCount = parseInt(localStorage.getItem('delivery_count') || '0');

            if (savedDate !== todayStr) {
                localStorage.setItem('delivery_date', todayStr);
                localStorage.setItem('delivery_count', '0');
                currentCount = 0;
            }
            return currentCount;
        }

        function incrementOrderNumber() {
            let count = getTodayOrderNumber() + 1;
            localStorage.setItem('delivery_count', count);
            return count;
        }

        function checkAndResetDailyCount() {
            getTodayOrderNumber();
        }

        function updateCountHint() {
            const count = getTodayOrderNumber();
            const hintElem = document.getElementById('today-count-hint');
            if (hintElem) {
                hintElem.innerText = `今日: ${count}件`;
            }
        }

        // 新增/接單
        function addNewOrder() {
            const orderNum = incrementOrderNumber();
            updateCountHint();
            
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0].substring(0, 5); // 顯示 HH:MM
            currentOrderId = 'order_' + Date.now();

            orderData[currentOrderId] = {
                orderNum: orderNum,
                acceptTime: now,
                startTime: null,
                startLat: null,
                startLon: null
            };

            getGPS(currentOrderId, '接單');

            // 轉換為取餐/送達大按鈕
            document.getElementById('panel-body').innerHTML = `
                <div class="status-box" style="margin-bottom: 6px; color: #4FC3F7; font-weight: bold;">
                    單 ${orderNum} 進行中 (${timeStr} 接單)
                </div>
                <button class="action-btn btn-start" onclick="recordAction('取餐')">🟢 點擊取餐</button>
                <button class="action-btn btn-end" onclick="recordAction('送達')">🔴 點擊送達</button>
            `;
        }

        // 記錄動作 (取餐 / 送達)
        function recordAction(actionType) {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0].substring(0, 5);
            const orderNum = localStorage.getItem('delivery_count');

            if (actionType === '取餐') {
                orderData[currentOrderId].startTime = now;
                document.getElementById('panel-body').innerHTML = `
                    <div class="status-box" style="margin-bottom: 6px; color: #81C784; font-weight: bold;">
                        單 ${orderNum} 已取餐 (${timeStr})
                    </div>
                    <button class="action-btn btn-start" style="opacity: 0.5;" disabled>🟢 已取餐</button>
                    <button class="action-btn btn-end" onclick="recordAction('送達')">🔴 點擊送達</button>
                `;
            } 
            else if (actionType === '送達') {
                document.getElementById('panel-body').innerHTML = `
                    <div class="status-box" style="color: #FF5252; font-weight: bold;">
                        🔴 單 ${orderNum} 已完成！
                    </div>
                `;
                
                // 1秒後自動恢復成「接新單」按鈕，準備接下一單
                setTimeout(() => {
                    resetPanel();
                }, 1000);
            }
        }

        // 重置面板回到接單狀態
        function resetPanel() {
            currentOrderId = null;
            updateCountHint();
            document.getElementById('panel-body').innerHTML = `
                <button class="action-btn btn-accept" onclick="addNewOrder()">➕ 接新單 (記錄時間)</button>
            `;
        }

        function getGPS(orderId, actionType) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        if (actionType === '接單' && orderData[orderId]) {
                            orderData[orderId].startLat = position.coords.latitude;
                            orderData[orderId].startLon = position.coords.longitude;
                        }
                    },
                    (error) => { console.log("GPS 取得失敗"); },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            }
        }
    </script>

</body>
</html>
