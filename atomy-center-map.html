        function initQuickTags() {
            const wrapper = document.getElementById('tags-wrapper');
            const districtSet = new Set();

            atomyCenters.forEach(c => {
                if (c.address) {
                    let city = c.address.substring(0, 3).replace("臺", "台");
                    if (city.endsWith("市") || city.endsWith("縣")) {
                        districtSet.add(city);
                    }
                }
            });

            districtSet.forEach(district => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn';
                btn.innerText = district;
                btn.onclick = () => quickSearch(district);
                wrapper.appendChild(btn);
            });
        }

        function quickSearch(keyword) {
            let cleanQuery = keyword.replace(/(新北市|臺北市|台北市|桃園市|台中市|臺中市|高雄市|市|區|縣|教育中心|艾多美)/g, "").trim();
            if (cleanQuery.length === 0) cleanQuery = keyword;

            const query = cleanQuery.replace("臺", "台");

            const filtered = atomyCenters.filter(c => 
                c.name.replace("臺", "台").includes(query) || 
                c.address.replace("臺", "台").includes(query)
            );

            if (filtered.length === 0) {
                renderList([], `點選 "${keyword}"：查無資料`);
                return;
            }

            renderList(filtered, `"${keyword}" 相關據點 (${filtered.length} 筆)`);
        }

        function renderList(centers, statusText) {
            const listEl = document.getElementById('center-list');
            const countEl = document.getElementById('result-count');
            listEl.innerHTML = '';

            countEl.innerText = statusText || `找到 ${centers.length} 間據點`;

            if (centers.length === 0) {
                listEl.innerHTML = '<div class="empty-tip">未找到相關教育中心，請選擇其他地區標籤。</div>';
                return;
            }

            centers.forEach(center => {
                const googleNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(center.address)}`;
                let copyTargetName = center.name.replace(/^艾多美\s*/, "").replace(/教育中心$/, "").trim();

                const card = document.createElement('div');
                card.className = 'center-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-name">${center.name}</span>
                    </div>
                    <div class="card-info">📌 ${center.address}</div>
                    <div class="card-info">📞 ${center.phone}</div>
                    <div class="card-actions">
                        <a href="tel:${center.phone}" class="action-btn btn-call">撥打</a>
                        <a href="${googleNavUrl}" target="_blank" class="action-btn btn-nav">🗺️ 導航</a>
                        <button class="action-btn btn-copy" onclick="copyName('${copyTargetName}')">📋 複製</button>
                    </div>
                `;

                listEl.appendChild(card);
            });
        }

        function copyName(targetName) {
            navigator.clipboard.writeText(targetName).then(() => {
                alert(`已成功複製：${targetName}`);
            }).catch(err => {
                console.error("複製失敗", err);
                alert("複製失敗，請手動複製。");
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            initQuickTags();
            liff.init({ liffId: LIFF_ID }).catch(err => console.error("LIFF 初始化失敗:", err));
        });
    </script>
