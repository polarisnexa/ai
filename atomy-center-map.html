        let userMarker = null;
        let markersGroup = L.layerGroup().addTo(map);

        // 自動從資料庫提取不重複的「2字地區標籤」
        function initQuickTags() {
            const wrapper = document.getElementById('tags-wrapper');
            const districtSet = new Set();

            atomyCenters.forEach(c => {
                // 正則匹配「區」或「市」前面的兩位地區名稱
                const match = c.address.match(/([\u4e00-\u9fa5]{2})[區市]/);
                if (match && match[1]) {
                    districtSet.add(match[1]);
                }
            });

            districtSet.forEach(district => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn';
                btn.innerText = district;
                btn.onclick = () => quickSearch(district);
                wrapper.appendChild(btn);
            });
        }

        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function calculateTravelTimeRanges(distKm) {
            let motoMin = Math.round((distKm / 42) * 60);
            let motoMax = Math.round((distKm / 30) * 60) + 2;

            let carMin = Math.round((distKm / 38) * 60);
            let carMax = Math.round((distKm / 25) * 60) + 3;

            motoMin = Math.max(motoMin, 2);
            motoMax = Math.max(motoMax, motoMin + 2);
            carMin = Math.max(carMin, 3);
            carMax = Math.max(carMax, carMin + 3);

            return {
                moto: `${motoMin}~${motoMax} 分鐘`,
                car: `${carMin}~${carMax} 分鐘`
            };
        }

        function searchByKeyword() {
            let rawQuery = document.getElementById('search-input').value.trim();
            
            if (!rawQuery) {
                alert("請輸入地區名稱（例如：新莊、板橋）");
                return;
            }

            let cleanQuery = rawQuery.replace(/(新北市|臺北市|台北市|桃園市|台中市|臺中市|高雄市|市|區|縣|教育中心|艾多美)/g, "").trim();
            if (cleanQuery.length === 0) cleanQuery = rawQuery;

            const query = cleanQuery.substring(0, 2);

            markersGroup.clearLayers();
            if (userMarker) map.removeLayer(userMarker);

            const filtered = atomyCenters.filter(c => 
                c.name.includes(query) || c.address.includes(query)
            );

            if (filtered.length === 0) {
                renderList([], `搜尋 "${query}"：查無資料`);
                return;
            }

            const bounds = L.latLngBounds(filtered.map(c => [c.lat, c.lng]));
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });

            renderList(filtered, `"${query}" 相關據點 (${filtered.length} 筆)`);
        }

        function quickSearch(keyword) {
            document.getElementById('search-input').value = keyword;
            searchByKeyword();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchByKeyword();
            }
        }

        function locateUser() {
            if (!navigator.geolocation) {
                alert("您的裝置不支援地理定位。");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                map.setView([userLat, userLng], 12);

                markersGroup.clearLayers();
                if (userMarker) map.removeLayer(userMarker);

                userMarker = L.circle([userLat, userLng], {
                    color: '#06C755',
                    fillColor: '#06C755',
                    fillOpacity: 0.25,
                    radius: 500
                }).addTo(map).bindPopup("📍 您的位置").openPopup();

                const nearbyCenters = atomyCenters.map(center => {
                    const dist = getDistanceKm(userLat, userLng, center.lat, center.lng);
                    const times = calculateTravelTimeRanges(dist);
                    return { ...center, distance: dist, times: times };
                })
                .filter(center => center.distance <= 10)
                .sort((a, b) => a.distance - b.distance);

                renderList(nearbyCenters, `找到 ${nearbyCenters.length} 間據點 (10km內)`);

            }, error => {
                alert("無法獲取定位權限，請開啟 GPS 或點選地區標籤。");
            }, { enableHighAccuracy: true });
        }

        function renderList(centers, statusText) {
            const listEl = document.getElementById('center-list');
            const countEl = document.getElementById('result-count');
            listEl.innerHTML = '';

            countEl.innerText = statusText || `找到 ${centers.length} 間據點`;

            if (centers.length === 0) {
                listEl.innerHTML = '<div class="empty-tip">未找到相關教育中心，請選擇其他地區標籤。</div>';
                return;
            }

            centers.forEach(center => {
                const googleNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(center.address)}`;
                
                const distText = center.distance ? `距離：${center.distance.toFixed(1)} km` : '';
                const timeText = center.times ? `<br>🛵 機車：${center.times.moto}<br>🚗 汽車：${center.times.car}` : '';
                
                L.marker([center.lat, center.lng])
                    .addTo(markersGroup)
                    .bindPopup(`<b>${center.name}</b><br>${distText}${timeText}`);

                const distBadge = center.distance ? `<span class="card-dist">約 ${center.distance.toFixed(1)} km</span>` : '';
                const timeBox = center.times ? `
                    <div class="time-estimate-box">
                        <div class="time-item">🛵 機車：<b>${center.times.moto}</b></div>
                        <div class="time-item">🚗 汽車：<b>${center.times.car}</b></div>
                    </div>` : '';

                const motoTimeVal = center.times ? center.times.moto : '依導航為準';
                const carTimeVal = center.times ? center.times.car : '依導航為準';

                const card = document.createElement('div');
                card.className = 'center-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-name">${center.name}</span>
                        ${distBadge}
                    </div>
                    
                    ${timeBox}

                    <div class="card-info">📌 ${center.address}</div>
                    <div class="card-info">📞 ${center.phone}</div>
                    <div class="card-actions">
                        <a href="tel:${center.phone}" class="action-btn btn-call">撥打</a>
                        <a href="${googleNavUrl}" target="_blank" class="action-btn btn-nav">🗺️ 導航</a>
                        <button class="action-btn btn-share" onclick="shareCenter('${center.name}', '${center.address}', '${center.phone}', '${motoTimeVal}', '${carTimeVal}')">💬 分享</button>
                    </div>
                `;

                card.onclick = (e) => {
                    if (e.target.tagName !== 'A' && e.target.tagName !== 'BUTTON') {
                        map.setView([center.lat, center.lng], 15);
                    }
                };

                listEl.appendChild(card);
            });
        }

        async function shareCenter(name, address, phone, motoTime, carTime) {
            if (!liff.isLoggedIn()) {
                alert("即將引導登入 LINE 帳號以啟用分享功能...");
                liff.login();
                return;
            }

            if (!liff.isApiAvailable('shareTargetPicker')) {
                alert("無法開啟分享功能，請確認 LINE Developers Console 已啟用 Share Target Picker 機能。");
                return;
            }

            let targetUrl = `https://liff.line.me/${LIFF_ID}`;
            if (!window.location.href.startsWith('https://')) {
                targetUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
            }

            try {
                const res = await liff.shareTargetPicker([
                    {
                        type: "flex",
                        altText: `📍 推薦艾多美教育中心：${name}`,
                        contents: {
                            type: "bubble",
                            size: "medium",
                            header: {
                                type: "box",
                                layout: "vertical",
                                backgroundColor: "#06C755",
                                contents: [
                                    { type: "text", text: "🏢 艾多美教育中心資訊", color: "#ffffff", weight: "bold", size: "sm" }
                                ]
                            },
                            body: {
                                type: "box",
                                layout: "vertical",
                                contents: [
                                    { type: "text", text: name, weight: "bold", size: "md", wrap: true },
                                    { type: "text", text: `🛵 機車：${motoTime} | 🚗 汽車：${carTime}`, size: "xs", color: "#06C755", weight: "bold", margin: "xs" },
                                    { type: "text", text: `📌 地址：${address}`, size: "xs", color: "#666666", margin: "sm", wrap: true },
                                    { type: "text", text: `📞 電話：${phone}`, size: "xs", color: "#666666", margin: "xs" }
                                ]
                            },
                            footer: {
                                type: "box",
                                layout: "vertical",
                                contents: [
                                    {
                                        type: "button",
                                        action: {
                                            type: "uri",
                                            label: "🗺️ 查看地圖與導航",
                                            uri: targetUrl
                                        },
                                        style: "primary",
                                        color: "#4285F4",
                                        height: "sm"
                                    }
                                ]
                            }
                        }
                    }
                ]);

                if (res) console.log("分享成功");
            } catch (err) {
                console.error("分享失敗:", err);
                alert(`分享失敗，原因：${err.message || JSON.stringify(err)}`);
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            initQuickTags(); // 初始化自動生成地區標籤
            liff.init({ liffId: LIFF_ID }).catch(err => console.error("LIFF 初始化失敗:", err));
        });
    </script>
</body>
</html>
